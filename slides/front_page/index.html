<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>SpinDrift front page</title>
<!-- HyperFrames composition (https://github.com/heygen-com/hyperframes): the deck's cover, a 10 s seamless loop.
     Lean × Quantum × Bio = the astronaut. Frames: npx hyperframes snapshot; video: npx hyperframes render. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000;
          font-family: 'Inter', 'Segoe UI', sans-serif; color: #F5F5F7; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .center { position: absolute; left: 0; width: 1920px; margin: 0; text-align: center; }
  #title { top: 96px; font-size: 176px; font-weight: 800; line-height: 1.05; letter-spacing: -6px; }
  #title span { display: inline-block; padding: 0 12px;
                background: linear-gradient(90deg, #6FD0C2 0%, #8FB8FF 25%, #B48CFF 50%, #FF8FA3 75%, #6FD0C2 100%);
                background-size: 1000px 100%; background-repeat: repeat-x; background-position: 0px 0px;
                -webkit-background-clip: text; background-clip: text; color: transparent; }
  #sub { top: 292px; font-size: 58px; font-weight: 600; letter-spacing: -1.5px; color: #F5F5F7; }
  .tile { position: absolute; top: 440px; width: 250px; height: 250px; border-radius: 58px; box-sizing: border-box;
          background: linear-gradient(160deg, #1D1E22 0%, #111215 100%); border: 2px solid rgba(255, 255, 255, 0.10); }
  .tile svg { position: absolute; left: 0; top: 0; width: 250px; height: 250px; overflow: visible; }
  .glow { position: absolute; top: 380px; width: 370px; height: 370px; border-radius: 50%; }
  .op { position: absolute; top: 500px; width: 120px; margin: 0; text-align: center; font-size: 112px; font-weight: 400; line-height: 1; color: #86868B; }
  .lab { position: absolute; top: 726px; width: 360px; margin: 0; text-align: center; }
  .lab b { display: block; font-size: 50px; font-weight: 700; letter-spacing: -1px; }
  .lab span { display: block; margin-top: 8px; font-size: 28px; font-weight: 500; color: #A1A1A6; }
  #astro { position: absolute; left: 1415px; top: 405px; width: 270px; height: 324px; }
  #astro svg { width: 100%; height: 100%; overflow: visible; }
  #footer { top: 990px; font-size: 26px; font-weight: 600; color: #6E6E73; letter-spacing: 0.2px; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="10" data-width="1920" data-height="1080">

  <svg id="stars" class="layer" viewBox="0 0 1920 1080"></svg>

  <!-- soft colour behind each term -->
  <div class="glow" style="left:165px;background:radial-gradient(circle, rgba(111,208,194,0.22), transparent 65%)"></div>
  <div class="glow" style="left:555px;background:radial-gradient(circle, rgba(180,140,255,0.24), transparent 65%)"></div>
  <div class="glow" style="left:945px;background:radial-gradient(circle, rgba(255,143,163,0.22), transparent 65%)"></div>
  <div class="glow" id="astroGlow" style="left:1365px;top:360px;width:420px;height:420px;background:radial-gradient(circle, rgba(143,184,255,0.30), transparent 62%)"></div>

  <h1 id="title" class="center"><span>SpinDrift</span></h1>
  <p id="sub" class="center">Quantum Sensors for Astronauts</p>

  <!-- Lean: proves it -->
  <div class="tile" id="t-lean" style="left:225px">
    <svg viewBox="0 0 250 250">
      <circle id="leanRing" cx="125" cy="125" r="72" fill="none" stroke="#6FD0C2" stroke-width="10" opacity="0.35"/>
      <circle cx="125" cy="125" r="72" fill="none" stroke="#6FD0C2" stroke-width="10"/>
      <path d="M90 128 L116 154 L164 100" fill="none" stroke="#6FD0C2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="op" style="left:475px">×</p>

  <!-- Quantum: senses it -->
  <div class="tile" id="t-quantum" style="left:615px">
    <svg viewBox="0 0 250 250">
      <g id="atom" style="transform-origin:125px 125px">
        <g transform="rotate(0 125 125)"><ellipse cx="125" cy="125" rx="88" ry="32" fill="none" stroke="#B48CFF" stroke-width="7"/><circle cx="213" cy="125" r="10" fill="#E9DDFF"/></g>
        <g transform="rotate(60 125 125)"><ellipse cx="125" cy="125" rx="88" ry="32" fill="none" stroke="#B48CFF" stroke-width="7"/><circle cx="37" cy="125" r="10" fill="#E9DDFF"/></g>
        <g transform="rotate(120 125 125)"><ellipse cx="125" cy="125" rx="88" ry="32" fill="none" stroke="#B48CFF" stroke-width="7"/><circle cx="213" cy="125" r="10" fill="#E9DDFF"/></g>
      </g>
      <circle id="nucleus" cx="125" cy="125" r="17" fill="#B48CFF"/>
    </svg>
  </div>
  <p class="op" style="left:865px">×</p>

  <!-- Bio: the body's signals -->
  <div class="tile" id="t-bio" style="left:1005px">
    <svg viewBox="0 0 250 250">
      <path id="bioHeart" d="M125 196 C82 166 52 140 52 104 C52 78 72 60 96 60 C108 60 119 66 125 76 C131 66 142 60 154 60 C178 60 198 78 198 104 C198 140 168 166 125 196 Z" fill="#FF8FA3"/>
      <!-- one heartbeat (P wave, QRS spike, T wave) as a single continuous line -->
      <path id="ecg" d="M38 130 L68 130 C73 130 75 120 81 120 C87 120 89 130 94 130 L102 130 L107 139 L118 82 L129 150 L135 130 L146 130 C152 130 155 113 163 113 C171 113 174 130 180 130 L212 130"
            fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="op" style="left:1265px">=</p>

  <!-- the astronaut with four glowing sensors: brain (helmet), heart (chest), blood (wrist), skin (forearm) -->
  <div id="astro">
    <svg viewBox="0 0 400 480">
      <defs>
        <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2F5579"/><stop offset="0.55" stop-color="#15283D"/><stop offset="1" stop-color="#0B1520"/>
        </linearGradient>
        <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E0E8"/>
        </linearGradient>
      </defs>
      <rect x="104" y="168" width="192" height="196" rx="44" fill="#B5C0CC"/>
      <g transform="rotate(10 170 335)">
        <rect x="140" y="320" width="62" height="112" rx="30" fill="url(#suit)"/>
        <rect x="133" y="404" width="76" height="44" rx="22" fill="#8C98AA"/>
      </g>
      <g transform="rotate(-16 232 335)">
        <rect x="204" y="320" width="62" height="112" rx="30" fill="url(#suit)"/>
        <rect x="197" y="404" width="76" height="44" rx="22" fill="#8C98AA"/>
      </g>
      <g transform="rotate(-38 140 222)">
        <rect x="112" y="128" width="56" height="112" rx="28" fill="url(#suit)"/>
        <circle cx="140" cy="122" r="27" fill="#8C98AA"/>
        <circle id="halo-skin" cx="140" cy="168" r="15" fill="#FFC857" opacity="0.85"/>
        <rect x="124" y="158" width="32" height="20" rx="8" fill="#FFC857"/>
      </g>
      <g transform="rotate(-30 262 222)">
        <rect x="234" y="210" width="56" height="112" rx="28" fill="url(#suit)"/>
        <circle cx="262" cy="326" r="27" fill="#8C98AA"/>
        <circle id="halo-blood" cx="262" cy="296" r="15" fill="#B48CFF" opacity="0.85"/>
        <rect x="236" y="288" width="52" height="16" rx="8" fill="#B48CFF"/>
      </g>
      <rect x="118" y="186" width="164" height="168" rx="62" fill="url(#suit)"/>
      <rect x="158" y="268" width="84" height="48" rx="12" fill="#E3E8EE" stroke="#C5CED9" stroke-width="2"/>
      <circle cx="180" cy="292" r="6" fill="#A9B4C2"/><circle cx="200" cy="292" r="6" fill="#A9B4C2"/><circle cx="220" cy="292" r="6" fill="#A9B4C2"/>
      <circle id="halo-heart" cx="238" cy="232" r="14" fill="#FF6B81" opacity="0.85"/>
      <path id="dot-heart" d="M238 244 C226 236 222 230 222 224 C222 218 227 214 232 214 C235 214 237 216 238 218 C239 216 241 214 244 214 C249 214 254 218 254 224 C254 230 250 236 238 244 Z" fill="#FF6B81"/>
      <rect x="134" y="186" width="132" height="24" rx="12" fill="#B5C0CC"/>
      <rect x="96" y="96" width="18" height="40" rx="9" fill="#B5C0CC"/><rect x="286" y="96" width="18" height="40" rx="9" fill="#B5C0CC"/>
      <circle cx="200" cy="112" r="96" fill="url(#suit)"/>
      <rect x="128" y="72" width="144" height="106" rx="53" fill="url(#visor)"/>
      <ellipse cx="166" cy="98" rx="21" ry="11" fill="#FFFFFF" opacity="0.55" transform="rotate(-24 166 98)"/>
      <circle cx="197" cy="89" r="5" fill="#FFFFFF" opacity="0.45"/>
      <path d="M146 150 Q200 172 254 150" stroke="#6FD0C2" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
      <circle id="halo-brain" cx="200" cy="20" r="15" fill="#6FD0C2" opacity="0.85"/>
      <rect x="185" y="10" width="30" height="20" rx="9" fill="#6FD0C2"/>
    </svg>
  </div>

  <p class="lab" style="left:170px"><b style="color:#6FD0C2">Lean</b><span>proves it</span></p>
  <p class="lab" style="left:560px"><b style="color:#B48CFF">Quantum</b><span>senses it</span></p>
  <p class="lab" style="left:950px"><b style="color:#FF8FA3">Bio</b><span>brain · heart · blood · skin</span></p>
  <p class="lab" style="left:1370px"><b>Astronaut</b><span>in space</span></p>

  <p id="footer" class="center">NASA Space Apps 2026</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      let seed = 20261115;                              // fixed seed: identical stars on every render
      const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const NS = "http://www.w3.org/2000/svg", sky = document.getElementById("stars"), stars = [];
      for (let i = 0; i < 120; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", (rnd() * 1920).toFixed(1)); c.setAttribute("cy", (rnd() * 1080).toFixed(1));
        c.setAttribute("r", (0.5 + rnd() * rnd() * 1.8).toFixed(2)); c.setAttribute("fill", "#FFFFFF");
        sky.appendChild(c); stars.push(c);
      }

      const D = 10;                                     // loop length; every tween ends where it began
      const tl = gsap.timeline({ paused: true });

      stars.forEach((s) => {
        const n = [1, 2, 5][Math.floor(rnd() * 3)], hi = 0.3 + rnd() * 0.5, lo = 0.04 + rnd() * 0.12;
        const a = rnd() < 0.5 ? hi : lo, b = a === hi ? lo : hi;
        tl.fromTo(s, { opacity: a }, { opacity: b, duration: D / n / 2, ease: "sine.inOut", yoyo: true, repeat: 2 * n - 1 }, 0);
      });

      // the title's colours slide through once per loop
      tl.fromTo("#title span", { backgroundPosition: "0px 0px" }, { backgroundPosition: "1000px 0px", duration: D, ease: "none" }, 0);

      // the four terms bob in a wave (alternate ones start high and low)
      [["#t-lean", -9], ["#t-quantum", 9], ["#t-bio", -9], ["#astro", 9]].forEach(([sel, a]) => {
        tl.fromTo(sel, { y: a }, { y: -a, duration: D / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      });
      tl.fromTo("#astro", { rotation: -6 }, { rotation: 6, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // Lean: the ring pulses outward
      const ring = gsap.timeline({ repeat: 3 });
      ring.fromTo("#leanRing", { scale: 1, opacity: 0.5, transformOrigin: "50% 50%" }, { scale: 1.45, opacity: 0, duration: 2.5, ease: "power2.out" });
      tl.add(ring, 0);

      // Quantum: the electrons orbit, the nucleus glows
      tl.fromTo("#atom", { rotation: 0 }, { rotation: 360, duration: D, ease: "none", svgOrigin: "125 125" }, 0);
      tl.fromTo("#nucleus", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.25, duration: 1.25, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);

      // Bio: the heart beats 60 times a minute and the trace runs
      const beat = gsap.timeline({ repeat: 9 });
      beat.fromTo("#bioHeart", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.1, duration: 0.1, ease: "power1.out" })
          .to("#bioHeart", { scale: 1, duration: 0.14, ease: "power1.in" })
          .to("#bioHeart", { scale: 1.06, duration: 0.1, ease: "power1.out" })
          .to("#bioHeart", { scale: 1, duration: 0.66, ease: "power1.in" });
      tl.add(beat, 0);

      // the astronaut's sensors: heart at 60 per minute, the others breathe
      const pulse = (sel, period, reps, max) => {
        const p = gsap.timeline({ repeat: reps - 1 });
        p.fromTo(sel, { scale: 1, opacity: 0.85, transformOrigin: "50% 50%" }, { scale: max, opacity: 0, duration: period, ease: "power2.out" });
        tl.add(p, 0);
      };
      pulse("#halo-brain", 2, 5, 2.8); pulse("#halo-blood", 2.5, 4, 2.6); pulse("#halo-skin", 5 / 3, 6, 2.6);
      const hb = gsap.timeline({ repeat: 9 });
      hb.fromTo("#halo-heart", { scale: 1, opacity: 0.85, transformOrigin: "50% 50%" }, { scale: 2.0, opacity: 0, duration: 0.24, ease: "power1.out" })
        .fromTo("#halo-heart", { scale: 1, opacity: 0.85 }, { scale: 3.0, opacity: 0, duration: 0.76, ease: "power2.out" });
      tl.add(hb, 0);
      tl.fromTo("#astroGlow", { opacity: 0.75 }, { opacity: 1, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      tl.set({}, {}, D);
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = tl;
    })();
  </script>
</div>
</body>
</html>
