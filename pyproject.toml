# Only for the public serverless API on Vercel (api/index.py): the few packages it imports. The data pipeline and
# the full local server use requirements.txt (pip install -r requirements.txt).
[project]
name = "spindrift-public-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.13.4",
  "starlette==1.3.1",
]
