<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpinDrift · every signal a theorem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- loader: the percentage is the real share of files loaded -->
  <div id="loader">
    <div class="ld-box">
      <div class="ld-brand"><b class="wordmark">SpinDrift</b><small>⊢ every signal a theorem</small></div>
      <div class="ld-pct"><span id="ld-num">00</span><small>%</small></div>
      <ol class="ld-steps">
        <li id="ld-1"><span>01</span>Real data files</li>
        <li id="ld-2"><span>02</span>The astronaut and the sensors</li>
        <li id="ld-3"><span>03</span>Lean, the maths referee</li>
      </ol>
    </div>
  </div>

  <header class="topbar">
    <div class="tb-brand"><b class="wordmark">SpinDrift</b><small>⊢ every signal a theorem</small></div>
    <nav class="tb-nav" id="tb-nav"><button data-tab="body" class="on">Does it work?</button><button data-tab="hw">Hardware</button></nav>
    <div class="tb-mission">
      <select id="place" class="bare" title="Place" hidden></select>
      <select id="location" class="bare" title="Exact spot"></select>
      <span class="sex-toggle" title="Body figure: female or male"><button data-sex="female" title="Female" aria-label="Female">♀</button><button data-sex="male" class="on" title="Male" aria-label="Male">♂</button></span>
      <span class="tb-status" id="tb-status"><i></i><span>server</span></span>
    </div>
  </header>

  <!-- ONE PAGE: the astronaut; tap a sensor or scroll to dive to the quantum level -->
  <main class="view on" id="view-body">
    <div class="stage" id="stage">
      <canvas id="twin"></canvas>
      <canvas id="micro"></canvas>
      <svg id="leaders"></svg>
      <div id="labels"></div>
      <div id="micro-labels"></div>
      <div id="twin-notes"></div>
      <div class="fov" id="fov"><div class="fov-n"><b id="fov-num">2.00</b><span id="fov-unit">m</span></div><small>FIELD OF VIEW · <span id="fov-lvl">LEVEL 1</span></small></div>
      <div id="rail-wrap"></div>
      <div class="hud" id="hud" hidden>
        <div class="hud-gene" id="hud-gene"></div>
      </div>
      <div class="scalebar" id="scalebar"><i></i><span>1 m</span></div>
      <div class="descend" id="descend"><button id="go-up" title="Up one level (↑)">↑</button><span>Scroll to dive</span><button id="go-down" title="Down one level (↓)">↓</button><button class="linkish" id="go-labels">Labels</button><button class="linkish" id="go-src">Sources</button></div>
    </div>
    <!-- the right column, at every depth: what you are looking at (while diving), then Lean's four sensor cards with
         the same four numbers you can change -->
    <aside class="card" id="card"><div id="card-level"></div><div id="card-lean"></div></aside>
  </main>

  <!-- HARDWARE: the four real devices, and the all-in-one built run by run from Lean's results -->
  <section class="view page" id="view-hw"></section>

  <footer class="statusline">
    <span>EVERY VALUE SOURCED · LEAN DECIDES · NOT DIAGNOSTIC</span>
    <button class="linkish" id="open-sources">SOURCES AND CREDITS ›</button>
  </footer>

  <div class="modal" id="sources" hidden><div class="modal-card"><div class="modal-head"><b>Sources and credits</b><button class="x" id="close-sources">×</button></div><div id="sources-body"></div></div></div>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
